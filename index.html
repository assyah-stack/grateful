<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Thank you 💌</title><link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet"><style>
:root{--bg1:#fff4ec;--bg2:#fbd9d9;--ink:#5a3a3a;--card:#fffdf8;--accent:#e2706f;--env:#f3c9a5;--env2:#e9b48c;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2b1d24;--bg2:#4a2a36;--ink:#fbe9e4;--card:#3b2a31;--accent:#f08a88;--env:#d9a984;--env2:#c4906b;color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#2b1d24;--bg2:#4a2a36;--ink:#fbe9e4;--card:#3b2a31;--accent:#f08a88;--env:#d9a984;--env2:#c4906b}
*{box-sizing:border-box}
:root{--gl:.45}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 40%,var(--bg1),var(--bg2));color:var(--ink);font-family:'Caveat',cursive,sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage{position:fixed;inset:0}
#env{position:fixed;left:50%;top:50%;width:260px;height:170px;margin:-85px 0 0 -130px;cursor:pointer;z-index:2;perspective:800px;transition:opacity 1s}
#envf{position:fixed;left:50%;top:50%;width:260px;height:170px;margin:-85px 0 0 -130px;z-index:5;cursor:pointer;transition:opacity 1s}
#env:not(.open),#envf:not(.open),#envt:not(.open){animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1.5deg)}}
#tapme{position:fixed;left:0;right:0;top:calc(50% + 115px);text-align:center;font-size:34px;font-weight:700;color:var(--accent);z-index:5;transition:opacity .5s;animation:bobt 2s ease-in-out infinite;pointer-events:none}
@keyframes bobt{50%{transform:translateY(-6px)}}
#tapme.hide{opacity:0}
#env .back{position:absolute;inset:0;background:var(--env2);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.2)}
#envf .front{position:absolute;inset:0;border-radius:8px;background:linear-gradient(135deg,transparent 49.5%,var(--env) 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,var(--env) 50%) right/50% 100% no-repeat;filter:brightness(1.03)}
#envf .front::after{content:"";position:absolute;left:0;right:0;bottom:0;height:62%;background:var(--env);clip-path:polygon(0 100%,50% 0,100% 100%,100% 100%);border-radius:0 0 8px 8px;opacity:.9}
#envt{position:fixed;left:50%;top:50%;width:260px;height:170px;margin:-85px 0 0 -130px;z-index:6;cursor:pointer;perspective:800px;transition:opacity 1s}
#envt.open{z-index:2;transition:opacity 1s,z-index 0s .65s}
#envt .fw{position:absolute;left:0;top:0;width:100%;height:60%;transform-origin:top;transition:transform .8s ease .25s;z-index:4;filter:drop-shadow(0 4px 3px rgba(60,20,20,.32))}
#envt .flap{position:absolute;inset:0;background:linear-gradient(#f8dcc0,var(--env));clip-path:polygon(0 0,100% 0,50% 100%)}
#envt.open .fw{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:60%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:5;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.seal i{position:absolute;top:0;height:100%;width:50%;background:radial-gradient(circle at 35% 30%,#e8606a,#b0242e 60%,#8d1620);background-size:200% 100%;transition:transform .55s ease,opacity .55s}
.seal .sl{left:0;border-radius:23px 0 0 23px;background-position:left}
.seal .sr{right:0;border-radius:0 23px 23px 0;background-position:right}
.seal b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,235,235,.55);font-size:24px;text-shadow:0 1px 0 rgba(0,0,0,.25);transition:opacity .3s}
#envt.open .sl{transform:translate(-18px,16px) rotate(-35deg);opacity:0}
#envt.open .sr{transform:translate(18px,16px) rotate(35deg);opacity:0}
#envt.open .seal b{opacity:0}
#env.gone,#envf.gone,#envt.gone{opacity:0;pointer-events:none}
.circ{position:absolute;border-radius:50%;border:4px solid #fff;box-shadow:0 8px 22px rgba(120,50,60,.28);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;font-size:1.6em;overflow:hidden;cursor:default}
#main{z-index:3;left:50%;top:50%;opacity:0;transform:translate(-50%,-50%) scale(.6);transition:transform 1.1s ease-in-out,opacity .4s,top 1.1s,left .8s,width .8s,height .8s,margin .8s}
#main.pop{opacity:1;transform:translate(-50%,-135%) scale(.9)}
#main.settle{opacity:1;transform:translate(-50%,-50%) scale(1);z-index:6}
.small{opacity:0;transform:translate(-50%,-50%) scale(.4);transition:opacity .7s,transform .7s cubic-bezier(.3,1.6,.5,1);cursor:pointer;z-index:4}
.small.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.small:not(.show){pointer-events:none}
.small,#env,#envf,#envt{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none}
.small.wiggle:not(.done){animation:wig 1.1s ease-in-out infinite}
@keyframes wig{0%,100%{transform:translate(-50%,-50%) rotate(0)}15%{transform:translate(-50%,-50%) rotate(-12deg) scale(1.08)}30%{transform:translate(-50%,-50%) rotate(10deg) scale(1.08)}45%{transform:translate(-50%,-50%) rotate(-7deg)}60%{transform:translate(-50%,-50%) rotate(5deg)}75%{transform:translate(-50%,-50%) rotate(0)}}
.small.done{border-color:#fff6c9;box-shadow:0 0 0 calc(3px*var(--gl)) rgba(255,214,120,calc(.9*var(--gl))),0 0 calc(22px*var(--gl)) calc(8px*var(--gl)) rgba(255,196,90,calc(.85*var(--gl))),0 0 calc(44px*var(--gl)) calc(16px*var(--gl)) rgba(255,140,160,calc(.55*var(--gl)))}
@keyframes glow{50%{box-shadow:0 0 0 3px rgba(255,214,120,.9),0 0 30px 12px rgba(255,196,90,.95),0 0 60px 22px rgba(255,140,160,.7)}}
.small:active{transform:translate(-50%,-50%) scale(.92)}
.msg{position:absolute;background:var(--card);padding:6px 8px;border-radius:10px;font-size:21px;line-height:1.1;box-shadow:0 6px 16px rgba(0,0,0,.18);transform:translate(-50%,-50%) rotate(var(--r)) scale(.7);opacity:0;transition:opacity .5s .5s,transform .5s .5s;z-index:7;text-align:center}
.msg.show{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}
.by{display:block;color:var(--accent);font-size:.85em;margin-top:2px}
.msg.fast{transition:none}
#arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease forwards}
.ln.static,.hd.static{animation:none;stroke-dashoffset:0;opacity:1}
.hd{opacity:0;animation:fadein .2s .55s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
#main.glow{border-color:#fff6c9;box-shadow:0 0 0 calc(3px*var(--gl)) rgba(255,214,120,calc(.9*var(--gl))),0 0 calc(26px*var(--gl)) calc(10px*var(--gl)) rgba(255,196,90,calc(.85*var(--gl))),0 0 calc(54px*var(--gl)) calc(20px*var(--gl)) rgba(255,140,160,calc(.55*var(--gl)))}
#final{position:absolute;left:50%;transform:translateX(-50%) scale(.8);font-size:clamp(34px,8vw,54px);font-weight:700;color:var(--accent);white-space:nowrap;opacity:0;transition:opacity 1s,transform 1s;z-index:7;pointer-events:none}
#final.show{opacity:1;transform:translateX(-50%) scale(1)}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14px);text-align:center;font-size:26px;opacity:0;transition:opacity .8s;z-index:8;pointer-events:none}
#hint.show{opacity:.85}
#btns{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;gap:10px;justify-content:center;opacity:0;pointer-events:none;transform:translateY(20px);transition:all .6s;z-index:9}
#btns.show{opacity:1;transform:none;pointer-events:auto}
#btns button{font:700 22px 'Caveat',cursive;background:var(--accent);color:#fff;border:0;border-radius:30px;padding:7px 20px;box-shadow:0 6px 16px rgba(0,0,0,.25);cursor:pointer}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:8}
.pan{background:var(--card);color:var(--ink);border-radius:16px;padding:12px;max-height:94vh;overflow:auto;width:min(420px,100%);box-shadow:0 10px 40px rgba(0,0,0,.4)}
.prev{display:flex;justify-content:center;margin-bottom:8px}
.prev canvas{max-width:100%;max-height:42vh;width:auto;height:auto;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0;font-size:22px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font:700 18px Caveat,cursive;border:2px solid var(--accent);background:transparent;color:var(--ink);border-radius:18px;padding:2px 10px;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.chip.sw{width:28px;height:28px;padding:0;border-radius:50%}
.chip.sw.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--accent)}
.acts{display:flex;gap:10px;justify-content:center;margin-top:10px}
.acts button{font:700 22px Caveat,cursive;border:0;border-radius:24px;padding:6px 22px;cursor:pointer;background:var(--accent);color:#fff}
.acts .no{background:transparent;color:var(--ink);border:2px solid var(--accent)}
#maker{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.55);overflow:auto;padding:10px;font-family:'Caveat',cursive}
.mk{max-width:520px;margin:0 auto;background:var(--card);color:var(--ink);border-radius:16px;padding:14px}
.mk h2{margin:0 0 4px;font-size:32px}.mk p{margin:4px 0;font-size:20px}
.mkr{display:flex;gap:10px;margin:12px 0;align-items:flex-start}
.mkth{flex:0 0 64px;height:64px;border-radius:50%;background:#e8d9d9 center/cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:28px}
.mkf{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0;font-size:20px}
.mkf input,.mkf textarea{font:600 18px 'Caveat',cursive;padding:5px 8px;border:2px solid var(--accent);border-radius:10px;background:transparent;color:var(--ink);width:100%}
.mkpick{align-self:flex-start;font:700 18px 'Caveat',cursive;color:#fff;background:var(--accent);padding:3px 14px;border-radius:16px;cursor:pointer}
.mkb{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--card);padding:8px 0}
.mkb button,#mkback{font:700 20px 'Caveat',cursive;border:0;border-radius:20px;padding:6px 16px;background:var(--accent);color:#fff;cursor:pointer}
#mkback{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:8px;z-index:140;display:none;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.mkopts{display:flex;flex-direction:column;gap:6px;margin:8px 0;padding:8px 10px;border:2px dashed var(--accent);border-radius:12px}
.mkopts label{display:flex;flex-direction:column;font-size:20px;font-weight:700}
.mkopts input{width:100%;accent-color:var(--accent)}
</style></head><body><div id="stage">
  <div id="hint">tap each photo ♥</div>
  <div id="final">We love you Maisa ♥</div>
  <svg id="arrows"></svg>
  <div id="tapme">tap the seal ♥</div>
  <div id="env"><div class="back"></div></div>
  <div id="envf"><div class="front"></div></div>
  <div id="envt"><div class="fw"><div class="flap"></div></div><div class="seal"><i class="sl"></i><i class="sr"></i><b>♥</b></div></div>
  
</div>
